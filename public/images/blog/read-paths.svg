<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.6" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="g2B" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.4"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2O" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.42"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131d38"/><stop offset="1" stop-color="#0d152c"/></linearGradient>
    <linearGradient id="cardH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2748"/><stop offset="1" stop-color="#131c38"/></linearGradient>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="cs2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#ff6a3d" flood-opacity="0.4"/></filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>
  <circle cx="180" cy="110" r="240" fill="url(#g2B)" filter="url(#blur2)"/>
  <circle cx="1030" cy="560" r="250" fill="url(#g2O)" filter="url(#blur2)"/>

  <text x="80" y="86" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">THREE WAYS TO BUILD</text>
  <text x="78" y="132" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">Custom, no-code, or white-label</text>

  <!-- All three cards share the same top (200) and height (372) -->

  <!-- Card 1: Custom -->
  <g filter="url(#cs2)"><rect x="80" y="200" width="330" height="372" rx="20" fill="url(#cardG)" stroke="#243052"/></g>
  <rect x="112" y="236" width="52" height="52" rx="13" fill="#16224a"/>
  <g stroke="#9ab6ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M132 254 l-8 8 l8 8"/><path d="M144 254 l8 8 l-8 8"/></g>
  <text x="112" y="322" font-size="13" font-weight="700" letter-spacing="2" fill="#9ab6ff">CUSTOM CODE</text>
  <text x="112" y="360" font-size="30" font-weight="800" fill="#ffffff">$50-120k</text>
  <g transform="translate(112,376)"><rect width="120" height="26" rx="13" fill="#16224a"/><circle cx="18" cy="13" r="5" fill="#9ab6ff"/><text x="66" y="18" font-size="12.5" font-weight="600" fill="#c7d2ea" text-anchor="middle">8-14 months</text></g>
  <line x1="112" y1="420" x2="378" y2="420" stroke="#243052"/>
  <g font-size="14.5" fill="#c7d2ea"><text x="134" y="452">You own every line</text><text x="134" y="484">Build anything you want</text></g>
  <g font-size="14.5" fill="#8794b3"><text x="134" y="516">You carry maintenance</text><text x="134" y="548">Highest cost, longest wait</text></g>
  <g fill="none" stroke="#9ab6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M112 447 l4 4 l7 -8"/><path d="M112 479 l4 4 l7 -8"/></g>
  <g fill="none" stroke="#5b6480" stroke-width="2.2" stroke-linecap="round"><path d="M112 512 l12 0"/><path d="M112 544 l12 0"/></g>

  <!-- Card 2: No-code -->
  <g filter="url(#cs2)"><rect x="435" y="200" width="330" height="372" rx="20" fill="url(#cardG)" stroke="#243052"/></g>
  <rect x="467" y="236" width="52" height="52" rx="13" fill="#12271f"/>
  <g stroke="#7ad0a8" stroke-width="3" fill="none" stroke-linecap="round"><line x1="483" y1="254" x2="507" y2="254"/><circle cx="490" cy="254" r="4.5" fill="#0d152c"/><line x1="483" y1="270" x2="507" y2="270"/><circle cx="500" cy="270" r="4.5" fill="#0d152c"/></g>
  <text x="467" y="322" font-size="13" font-weight="700" letter-spacing="2" fill="#7ad0a8">NO-CODE</text>
  <text x="467" y="360" font-size="30" font-weight="800" fill="#ffffff">Subscription</text>
  <g transform="translate(467,376)"><rect width="120" height="26" rx="13" fill="#12271f"/><circle cx="18" cy="13" r="5" fill="#7ad0a8"/><text x="66" y="18" font-size="12.5" font-weight="600" fill="#c7d2ea" text-anchor="middle">weeks to launch</text></g>
  <line x1="467" y1="420" x2="733" y2="420" stroke="#243052"/>
  <g font-size="14.5" fill="#c7d2ea"><text x="489" y="452">Configure, not code</text><text x="489" y="484">Cost drops sharply</text></g>
  <g font-size="14.5" fill="#8794b3"><text x="489" y="516">Work within the platform</text><text x="489" y="548">Less bespoke control</text></g>
  <g fill="none" stroke="#7ad0a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M467 447 l4 4 l7 -8"/><path d="M467 479 l4 4 l7 -8"/></g>
  <g fill="none" stroke="#5b6480" stroke-width="2.2" stroke-linecap="round"><path d="M467 512 l12 0"/><path d="M467 544 l12 0"/></g>

  <!-- Card 3: White-label (highlighted, same size as the others) -->
  <g filter="url(#glow)"><rect x="790" y="200" width="330" height="372" rx="20" fill="url(#cardH)" stroke="url(#hl)" stroke-width="2"/></g>
  <rect x="790" y="200" width="330" height="6" rx="3" fill="url(#hl)"/>
  <g transform="translate(978,184)"><rect width="120" height="34" rx="17" fill="url(#hl)"/><text x="60" y="23" font-size="13" font-weight="800" fill="#3a1c0c" text-anchor="middle">BEST VALUE</text></g>
  <rect x="822" y="236" width="52" height="52" rx="13" fill="#2a1a12"/>
  <g fill="none" stroke="#ffb27a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M848 250 l0 24"/><path d="M838 262 l10 -12 l10 12"/><path d="M840 276 l16 0"/></g>
  <text x="822" y="322" font-size="13" font-weight="700" letter-spacing="2" fill="#ff9166">WHITE-LABEL</text>
  <text x="822" y="360" font-size="30" font-weight="800" fill="#ffffff">Flat monthly</text>
  <g transform="translate(822,376)"><rect width="130" height="26" rx="13" fill="#2a1a12"/><circle cx="18" cy="13" r="5" fill="#ffb27a"/><text x="71" y="18" font-size="12.5" font-weight="600" fill="#f0e5da" text-anchor="middle">~14 days to launch</text></g>
  <line x1="822" y1="420" x2="1088" y2="420" stroke="#3a3350"/>
  <g font-size="14.5" fill="#f0e5da"><text x="844" y="452">3 apps built in</text><text x="844" y="484">Rebrand and go live</text><text x="844" y="516">$0 platform fees</text><text x="844" y="548">Cheapest, fastest route</text></g>
  <g fill="none" stroke="#ff9166" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M822 447 l4 4 l7 -8"/><path d="M822 479 l4 4 l7 -8"/><path d="M822 511 l4 4 l7 -8"/><path d="M822 543 l4 4 l7 -8"/></g>
</svg>
