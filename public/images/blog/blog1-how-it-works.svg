<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="cv" cx="50%" cy="0%" r="120%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f8"/></radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c3b6b"/><stop offset="1" stop-color="#1a2445"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9cc0ff"/><stop offset="1" stop-color="#3f6fe0"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1c2748" flood-opacity="0.10"/></filter>
    <filter id="softlg" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1a2445" flood-opacity="0.26"/></filter>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3f6fe0"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#cv)"/>
  <text x="72" y="82" font-size="33" font-weight="800" fill="#0f1729" letter-spacing="-.6">How a multi-vendor food delivery app works</text>
  <text x="72" y="116" font-size="17" fill="#6b7280">Many restaurants under one app — isolated data, split payouts, one shared driver pool</text>

  <!-- One app node -->
  <g filter="url(#softlg)"><rect x="72" y="222" width="176" height="220" rx="22" fill="url(#dark)"/></g>
  <text x="160" y="262" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">One app</text>
  <rect x="98" y="284" width="124" height="30" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="98" y="322" width="124" height="30" rx="8" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="98" y="360" width="124" height="30" rx="8" fill="#ffffff" fill-opacity="0.5"/>
  <text x="160" y="416" font-size="13" fill="#b9c3e2" text-anchor="middle">Customers browse all</text>

  <!-- vendor cards -->
  <g>
    <g filter="url(#soft)"><rect x="440" y="164" width="320" height="86" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <circle cx="480" cy="207" r="18" fill="#ff7a59"/>
    <text x="516" y="200" font-size="16" font-weight="700" fill="#0f1729">Restaurant A</text>
    <text x="516" y="222" font-size="12.5" fill="#8a91a6">own menu · own orders · own payout</text>

    <g filter="url(#soft)"><rect x="440" y="268" width="320" height="86" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <circle cx="480" cy="311" r="18" fill="#3f6fe0"/>
    <text x="516" y="304" font-size="16" font-weight="700" fill="#0f1729">Restaurant B</text>
    <text x="516" y="326" font-size="12.5" fill="#8a91a6">own menu · own orders · own payout</text>

    <g filter="url(#soft)"><rect x="440" y="372" width="320" height="86" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <circle cx="480" cy="415" r="18" fill="#1f9f6e"/>
    <text x="516" y="408" font-size="16" font-weight="700" fill="#0f1729">Restaurant C</text>
    <text x="516" y="430" font-size="12.5" fill="#8a91a6">own menu · own orders · own payout</text>
  </g>

  <!-- payout engine -->
  <g filter="url(#softlg)"><rect x="856" y="222" width="272" height="220" rx="22" fill="url(#dark)"/></g>
  <rect x="856" y="222" width="272" height="5" rx="2.5" fill="#ff6a3d"/>
  <text x="992" y="266" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Split-payout engine</text>
  <text x="992" y="292" font-size="13" fill="#b9c3e2" text-anchor="middle">Every order divides into</text>
  <rect x="884" y="308" width="216" height="36" rx="9" fill="#ff6a3d"/><text x="906" y="331" font-size="14" font-weight="700" fill="#fff">Your commission</text>
  <rect x="884" y="352" width="216" height="36" rx="9" fill="#3a4877"/><text x="906" y="375" font-size="14" font-weight="700" fill="#fff">Each vendor's share</text>
  <text x="992" y="416" font-size="12.5" fill="#9aa7cc" text-anchor="middle">Tracked in the admin console</text>

  <!-- connectors -->
  <path d="M248 300 C 330 260, 360 220, 436 207" fill="none" stroke="url(#flow)" stroke-width="2.6" marker-end="url(#ah)"/>
  <path d="M248 332 C 340 330, 360 315, 436 311" fill="none" stroke="url(#flow)" stroke-width="2.6" marker-end="url(#ah)"/>
  <path d="M248 364 C 330 400, 360 430, 436 415" fill="none" stroke="url(#flow)" stroke-width="2.6" marker-end="url(#ah)"/>
  <path d="M760 311 C 810 311, 820 320, 852 328" fill="none" stroke="url(#flow)" stroke-width="2.8" marker-end="url(#ah)"/>

  <text x="72" y="548" font-size="15" fill="#6b7280">Vendor isolation + automatic split payouts + one shared driver pool = a real marketplace, not a demo.</text>
  <text x="1128" y="588" font-size="13" fill="#aeb4c7" text-anchor="end">nipige.com</text>
</svg>
