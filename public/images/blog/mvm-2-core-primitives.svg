<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="cv" cx="50%" cy="0%" r="120%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f8"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1c2748" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#cv)"/>
  <text x="72" y="76" font-size="32" font-weight="800" fill="#0f1729" letter-spacing="-.6">The 6 core primitives of a multi-vendor marketplace</text>
  <text x="72" y="108" font-size="16" fill="#6b7280">Missing any one of these, and it's a directory &#8212; not a marketplace.</text>

  <!-- 6 cards, 3x2 grid -->
  <g>
    <!-- card 1 -->
    <g filter="url(#soft)"><rect x="72" y="150" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="96" y="174" width="40" height="40" rx="10" fill="#06B6D4"/><text x="116" y="200" font-size="17" text-anchor="middle" fill="#fff">1</text>
    <text x="150" y="192" font-size="16.5" font-weight="700" fill="#0f1729">Vendor onboarding</text>
    <text x="150" y="212" font-size="12.5" fill="#8a91a6">Verification &amp; credentials</text>
    <text x="96" y="256" font-size="12.5" fill="#6b7280">Identity checks, category-specific</text>
    <text x="96" y="274" font-size="12.5" fill="#6b7280">credentials, and listing gates.</text>

    <!-- card 2 -->
    <g filter="url(#soft)"><rect x="435" y="150" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="459" y="174" width="40" height="40" rx="10" fill="#06B6D4"/><text x="479" y="200" font-size="17" text-anchor="middle" fill="#fff">2</text>
    <text x="513" y="192" font-size="16.5" font-weight="700" fill="#0f1729">Catalog / listings</text>
    <text x="513" y="212" font-size="12.5" fill="#8a91a6">Goods, services, or rentals</text>
    <text x="459" y="256" font-size="12.5" fill="#6b7280">Search, filters, and category-</text>
    <text x="459" y="274" font-size="12.5" fill="#6b7280">specific fields per vendor type.</text>

    <!-- card 3 -->
    <g filter="url(#soft)"><rect x="798" y="150" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="822" y="174" width="40" height="40" rx="10" fill="#06B6D4"/><text x="842" y="200" font-size="17" text-anchor="middle" fill="#fff">3</text>
    <text x="876" y="192" font-size="16.5" font-weight="700" fill="#0f1729">Order routing</text>
    <text x="876" y="212" font-size="12.5" fill="#8a91a6">Dispatch or scheduling</text>
    <text x="822" y="256" font-size="12.5" fill="#6b7280">Real-time assignment for on-</text>
    <text x="822" y="274" font-size="12.5" fill="#6b7280">demand; calendars for booked work.</text>

    <!-- card 4 -->
    <g filter="url(#soft)"><rect x="72" y="316" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="96" y="340" width="40" height="40" rx="10" fill="#ff6a3d"/><text x="116" y="366" font-size="17" text-anchor="middle" fill="#fff">4</text>
    <text x="150" y="358" font-size="16.5" font-weight="700" fill="#0f1729">Split payouts</text>
    <text x="150" y="378" font-size="12.5" fill="#8a91a6">Commission engine</text>
    <text x="96" y="422" font-size="12.5" fill="#6b7280">Escrow, automatic commission</text>
    <text x="96" y="440" font-size="12.5" fill="#6b7280">split, and vendor payout tracking.</text>

    <!-- card 5 -->
    <g filter="url(#soft)"><rect x="435" y="316" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="459" y="340" width="40" height="40" rx="10" fill="#ff6a3d"/><text x="479" y="366" font-size="17" text-anchor="middle" fill="#fff">5</text>
    <text x="513" y="358" font-size="16.5" font-weight="700" fill="#0f1729">Admin console</text>
    <text x="513" y="378" font-size="12.5" fill="#8a91a6">One dashboard, every vendor</text>
    <text x="459" y="422" font-size="12.5" fill="#6b7280">Orders, vendors, payouts, and</text>
    <text x="459" y="440" font-size="12.5" fill="#6b7280">marketplace health in one place.</text>

    <!-- card 6 -->
    <g filter="url(#soft)"><rect x="798" y="316" width="330" height="140" rx="16" fill="#ffffff" stroke="#eaeef6"/></g>
    <rect x="822" y="340" width="40" height="40" rx="10" fill="#ff6a3d"/><text x="842" y="366" font-size="17" text-anchor="middle" fill="#fff">6</text>
    <text x="876" y="358" font-size="16.5" font-weight="700" fill="#0f1729">Trust &amp; reviews</text>
    <text x="876" y="378" font-size="12.5" fill="#8a91a6">Two-way ratings, disputes</text>
    <text x="822" y="422" font-size="12.5" fill="#6b7280">Reviews release both ways, plus</text>
    <text x="822" y="440" font-size="12.5" fill="#6b7280">a flagging and dispute flow.</text>
  </g>

  <text x="72" y="510" font-size="15" fill="#6b7280">Skip any one of these, and vendors (or customers) will find the gap the hard way.</text>
  <text x="1128" y="608" font-size="13" fill="#aeb4c7" text-anchor="end">nipige.com</text>
</svg>
