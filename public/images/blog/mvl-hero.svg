<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ab6ff"/><stop offset="1" stop-color="#5b7de0"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b7de0"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="42" flood-color="#03060f" flood-opacity="0.55"/></filter>
    <clipPath id="cardClip"><rect x="648" y="118" width="474" height="480" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1015" cy="165" r="290" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="865" cy="690" r="265" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1"><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="570" x2="1200" y2="570"/></g>

  <!-- LEFT copy -->
  <text x="80" y="196" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">MARKETPLACE MODELS &#183; 2026</text>
  <text x="78" y="284" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2">Listing or</text>
  <text x="78" y="352" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2"><tspan fill="#ff9166">managed?</tspan></text>
  <text x="80" y="412" font-size="21" fill="#c2cbe6">Two words that decide how much your</text>
  <text x="80" y="442" font-size="21" fill="#c2cbe6">platform controls the sale.</text>
  <text x="80" y="600" font-size="14" fill="#6f7aa0">Most marketplaces sit on the spectrum, and move along it as they grow.</text>

  <!-- RIGHT: comparison card -->
  <g filter="url(#cardShadow)"><rect x="648" y="118" width="474" height="480" rx="24" fill="#f7f8fc"/></g>
  <g clip-path="url(#cardClip)">
    <rect x="648" y="118" width="474" height="72" fill="#ffffff"/>
    <rect x="648" y="118" width="474" height="480" fill="url(#cardsheen)" opacity="0.5"/>
  </g>
  <text x="672" y="150" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a91a6">TWO MODELS, ONE SPECTRUM</text>
  <text x="672" y="172" font-size="18" font-weight="800" fill="#1e2436">Listing vs managed</text>
  <line x1="672" y1="194" x2="1098" y2="194" stroke="#e7ebf4"/>

  <!-- vertical divider between columns -->
  <line x1="885" y1="214" x2="885" y2="470" stroke="#e7ebf4"/>

  <!-- LISTING column (center x=778) -->
  <rect x="702" y="220" width="152" height="30" rx="15" fill="#eaf0ff"/>
  <circle cx="726" cy="235" r="6" fill="url(#blue)"/>
  <text x="778" y="240" font-size="14" font-weight="800" fill="#2f4a8a" text-anchor="middle">LISTING</text>
  <g font-size="13.5" fill="#43506e" text-anchor="middle">
    <text x="778" y="290" font-weight="700">Connect, step back</text>
    <text x="778" y="332">Anyone can list</text>
    <text x="778" y="374">Earns listing or lead fees</text>
    <text x="778" y="416" fill="#8a93a8" font-size="12.5">Light to run, hands-off</text>
  </g>

  <!-- MANAGED column (center x=992) -->
  <rect x="916" y="220" width="152" height="30" rx="15" fill="#fff0e8"/>
  <circle cx="940" cy="235" r="6" fill="url(#orange)"/>
  <text x="992" y="240" font-size="14" font-weight="800" fill="#b34619" text-anchor="middle">MANAGED</text>
  <g font-size="13.5" fill="#43506e" text-anchor="middle">
    <text x="992" y="290" font-weight="700">Curate, run the sale</text>
    <text x="992" y="332">Vetted supply</text>
    <text x="992" y="374">Earns a commission</text>
    <text x="992" y="416" fill="#8a93a8" font-size="12.5">Heavier, hands-on</text>
  </g>

  <!-- spectrum bar at bottom -->
  <rect x="702" y="502" width="366" height="10" rx="5" fill="url(#spec)"/>
  <circle cx="710" cy="507" r="7" fill="#5b7de0" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1060" cy="507" r="7" fill="#ff7a59" stroke="#ffffff" stroke-width="2"/>
  <text x="702" y="536" font-size="12.5" font-weight="700" fill="#5b6480">hands-off</text>
  <text x="1068" y="536" font-size="12.5" font-weight="700" fill="#b34619" text-anchor="end">hands-on</text>
  <text x="885" y="576" font-size="12.5" fill="#8a93a8" text-anchor="middle">Airbnb, Uber, and DoorDash sit in the middle.</text>
</svg>
