<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="g2G" cx="30%" cy="35%" r="55%"><stop offset="0" stop-color="#39a37a" stop-opacity="0.3"/><stop offset="1" stop-color="#39a37a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2O" cx="85%" cy="75%" r="55%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.28"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="grn2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="cS2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#03060f" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="620" fill="url(#bg2)"/>
  <ellipse cx="330" cy="220" rx="440" ry="300" fill="url(#g2G)" filter="url(#blur2)"/>
  <ellipse cx="920" cy="470" rx="440" ry="300" fill="url(#g2O)" filter="url(#blur2)"/>

  <text x="72" y="66" font-size="15" font-weight="700" letter-spacing="3.5" fill="#ff9166">MULTI-VENDOR MARKETPLACE SOFTWARE 2026</text>
  <text x="70" y="112" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1">7 platforms, side by side</text>

  <!-- table card -->
  <g filter="url(#cS2)"><rect x="72" y="150" width="1056" height="410" rx="18" fill="#0f1a35" stroke="#26365a"/></g>
  <!-- header row -->
  <g font-size="13" font-weight="700" letter-spacing="0.5" fill="#8fa0c6">
    <text x="100" y="188">PLATFORM</text>
    <text x="330" y="188">BEST FOR</text>
    <text x="720" y="188">NATIVE APPS</text>
    <text x="910" y="188">FEE MODEL</text>
  </g>
  <line x1="88" y1="202" x2="1112" y2="202" stroke="#26365a"/>

  <!-- Nipige row (highlighted) -->
  <rect x="88" y="212" width="1024" height="44" rx="9" fill="#122a20" stroke="#2f7d5a"/>
  <g font-size="14.5"><text x="100" y="240" font-weight="800" fill="#7ad0a8">Nipige</text>
    <text x="330" y="240" fill="#d7e5f2">Fast branded launch, no code</text>
    <text x="720" y="240" font-weight="700" fill="#7ad0a8">Included</text>
    <text x="910" y="240" fill="#d7e5f2">Flat subscription, $0 fees</text></g>

  <g font-size="14.5" fill="#c3d0e6">
    <g transform="translate(0,282)"><text x="100" y="0" font-weight="700" fill="#ffffff">Sharetribe</text><text x="330" y="0">Flexible, extensible</text><text x="720" y="0" fill="#9fb0cc">Varies by plan</text><text x="910" y="0">Subscription</text></g>
    <g transform="translate(0,326)"><text x="100" y="0" font-weight="700" fill="#ffffff">CS-Cart Multi-Vendor</text><text x="330" y="0">Self-hosted control</text><text x="720" y="0" fill="#9fb0cc">Add-on / build</text><text x="910" y="0">Licence or subscription</text></g>
    <g transform="translate(0,370)"><text x="100" y="0" font-weight="700" fill="#ffffff">Mirakl</text><text x="330" y="0">Enterprise retailers</text><text x="720" y="0" fill="#9fb0cc">Enterprise</text><text x="910" y="0">Quote / GMV-based</text></g>
    <g transform="translate(0,414)"><text x="100" y="0" font-weight="700" fill="#ffffff">Arcadier</text><text x="330" y="0">Template no-code</text><text x="720" y="0" fill="#9fb0cc">Varies by plan</text><text x="910" y="0">Subscription</text></g>
    <g transform="translate(0,458)"><text x="100" y="0" font-weight="700" fill="#ffffff">Bubble</text><text x="330" y="0">Fully custom build</text><text x="720" y="0" fill="#9fb0cc">Extra work</text><text x="910" y="0">Usage-based</text></g>
    <g transform="translate(0,502)"><text x="100" y="0" font-weight="700" fill="#ffffff">Yo!Kart</text><text x="330" y="0">One-time licence</text><text x="720" y="0" fill="#9fb0cc">Add-on</text><text x="910" y="0">One-time licence</text></g>
  </g>
  <g stroke="#1b2942"><line x1="88" y1="300" x2="1112" y2="300"/><line x1="88" y1="344" x2="1112" y2="344"/><line x1="88" y1="388" x2="1112" y2="388"/><line x1="88" y1="432" x2="1112" y2="432"/><line x1="88" y1="476" x2="1112" y2="476"/></g>

  <text x="72" y="596" font-size="14" font-weight="500" fill="#8fa0c6">Read it as a routing table, not a ranking: the best software is the one that matches how you want to build and run it.</text>
</svg>
