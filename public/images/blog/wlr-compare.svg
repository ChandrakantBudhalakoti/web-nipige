<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="g2G" cx="30%" cy="40%" r="55%"><stop offset="0" stop-color="#39a37a" stop-opacity="0.35"/><stop offset="1" stop-color="#39a37a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2O" cx="80%" cy="70%" r="55%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.32"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="cS" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#03060f" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>
  <ellipse cx="330" cy="240" rx="440" ry="300" fill="url(#g2G)" filter="url(#blur2)"/>
  <ellipse cx="920" cy="470" rx="440" ry="300" fill="url(#g2O)" filter="url(#blur2)"/>

  <text x="72" y="70" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">THE REAL CHOICE</text>
  <text x="70" y="120" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">Your own app, or an aggregator's cut</text>

  <!-- CARD 1: your own app (highlighted green) -->
  <g filter="url(#cS)"><rect x="72" y="164" width="506" height="356" rx="20" fill="#0f2138" stroke="#39a37a" stroke-width="2"/></g>
  <g transform="translate(432,150)"><rect x="0" y="0" width="146" height="34" rx="17" fill="url(#badge)"/><text x="73" y="23" font-size="13" font-weight="800" fill="#08301e" text-anchor="middle">KEEP THE MARGIN</text></g>
  <text x="104" y="216" font-size="13" font-weight="700" letter-spacing="2" fill="#7ad0a8">YOUR OWN BRANDED APP</text>
  <text x="104" y="256" font-size="30" font-weight="800" fill="#ffffff">$0 platform fees</text>
  <line x1="104" y1="282" x2="546" y2="282" stroke="#233b52"/>
  <g font-size="16" fill="#cfe0f1">
    <g transform="translate(104,312)"><circle cx="7" cy="-5" r="6" fill="url(#badge)"/><text x="26" y="0" font-weight="600" fill="#9fb4cc">Commission</text><text x="442" y="0" font-weight="700" fill="#ffffff" text-anchor="end">$0 per order</text></g>
    <g transform="translate(104,360)"><circle cx="7" cy="-5" r="6" fill="url(#badge)"/><text x="26" y="0" font-weight="600" fill="#9fb4cc">Customer data</text><text x="442" y="0" font-weight="700" fill="#ffffff" text-anchor="end">Yours</text></g>
    <g transform="translate(104,408)"><circle cx="7" cy="-5" r="6" fill="url(#badge)"/><text x="26" y="0" font-weight="600" fill="#9fb4cc">Branding</text><text x="442" y="0" font-weight="700" fill="#ffffff" text-anchor="end">Your brand</text></g>
    <g transform="translate(104,456)"><circle cx="7" cy="-5" r="6" fill="url(#badge)"/><text x="26" y="0" font-weight="600" fill="#9fb4cc">Cost model</text><text x="442" y="0" font-weight="700" fill="#ffffff" text-anchor="end">Flat monthly</text></g>
  </g>

  <!-- CARD 2: aggregator (muted) -->
  <g filter="url(#cS)"><rect x="622" y="164" width="506" height="356" rx="20" fill="#0e1631" stroke="#28385c"/></g>
  <text x="654" y="216" font-size="13" font-weight="700" letter-spacing="2" fill="#ff9166">AGGREGATOR (DOORDASH, UBER EATS)</text>
  <text x="654" y="256" font-size="30" font-weight="800" fill="#ffd9c9">15-30% per order</text>
  <line x1="654" y1="282" x2="1096" y2="282" stroke="#243b58"/>
  <g font-size="16" fill="#b9c4dc">
    <g transform="translate(654,312)"><circle cx="7" cy="-5" r="6" fill="#ff7a59"/><text x="26" y="0" font-weight="600" fill="#8fa0c6">Commission</text><text x="442" y="0" font-weight="700" fill="#ffd9c9" text-anchor="end">15-30% / order</text></g>
    <g transform="translate(654,360)"><circle cx="7" cy="-5" r="6" fill="#ff7a59"/><text x="26" y="0" font-weight="600" fill="#8fa0c6">Customer data</text><text x="442" y="0" font-weight="700" fill="#e7ecfa" text-anchor="end">Theirs</text></g>
    <g transform="translate(654,408)"><circle cx="7" cy="-5" r="6" fill="#ff7a59"/><text x="26" y="0" font-weight="600" fill="#8fa0c6">Branding</text><text x="442" y="0" font-weight="700" fill="#e7ecfa" text-anchor="end">Their marketplace</text></g>
    <g transform="translate(654,456)"><circle cx="7" cy="-5" r="6" fill="#ff7a59"/><text x="26" y="0" font-weight="600" fill="#8fa0c6">Cost model</text><text x="442" y="0" font-weight="700" fill="#e7ecfa" text-anchor="end">% of every sale</text></g>
  </g>

  <text x="72" y="566" font-size="15" font-weight="500" fill="#8fa0c6">Many restaurants run both: the aggregator for discovery, their own app for repeat orders where the margin matters.</text>
</svg>
