<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081018"/><stop offset="0.55" stop-color="#0f2230"/><stop offset="1" stop-color="#123245"/></linearGradient>
    <radialGradient id="gT" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.5"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.4"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#020608" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#gT)" filter="url(#blurL)"/>
  <circle cx="900" cy="600" r="240" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1"><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/></g>

  <text x="80" y="140" font-size="15" font-weight="700" letter-spacing="4" fill="#7fd8ea">MARKETPLACE BUSINESS MODELS</text>
  <text x="78" y="216" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">How marketplaces</text>
  <text x="78" y="278" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5"><tspan fill="#7fd8ea">actually</tspan> make money</text>
  <text x="80" y="330" font-size="20" fill="#c2d3d8">Take-rate, subscription, listing fees, and</text>
  <text x="80" y="358" font-size="20" fill="#c2d3d8">freemium — compared, with real ranges.</text>

  <g transform="translate(80,400)">
    <rect width="150" height="44" rx="22" fill="url(#pill)"/>
    <text x="75" y="28" font-size="15" font-weight="700" fill="#0b1226" text-anchor="middle">4 models compared</text>
  </g>

  <!-- 4 stacked model chips on the right -->
  <g filter="url(#cardShadow)"><rect x="760" y="96" width="360" height="70" rx="14" fill="#ffffff"/></g>
  <rect x="784" y="118" width="8" height="26" rx="4" fill="#ff6a3d"/>
  <text x="804" y="128" font-size="15" font-weight="700" fill="#0f1729">Take-rate / commission</text>
  <text x="804" y="148" font-size="12" fill="#8a91a6">% of GMV per transaction</text>

  <g filter="url(#cardShadow)"><rect x="760" y="178" width="360" height="70" rx="14" fill="#ffffff"/></g>
  <rect x="784" y="200" width="8" height="26" rx="4" fill="#06B6D4"/>
  <text x="804" y="210" font-size="15" font-weight="700" fill="#0f1729">Flat subscription</text>
  <text x="804" y="230" font-size="12" fill="#8a91a6">Fixed monthly fee, any volume</text>

  <g filter="url(#cardShadow)"><rect x="760" y="260" width="360" height="70" rx="14" fill="#ffffff"/></g>
  <rect x="784" y="282" width="8" height="26" rx="4" fill="#8B5CF6"/>
  <text x="804" y="292" font-size="15" font-weight="700" fill="#0f1729">Listing fees</text>
  <text x="804" y="312" font-size="12" fill="#8a91a6">Pay to list, not to transact</text>

  <g filter="url(#cardShadow)"><rect x="760" y="342" width="360" height="70" rx="14" fill="#ffffff"/></g>
  <rect x="784" y="364" width="8" height="26" rx="4" fill="#f59e0b"/>
  <text x="804" y="374" font-size="15" font-weight="700" fill="#0f1729">Freemium + upsells</text>
  <text x="804" y="394" font-size="12" fill="#8a91a6">Free core, paid tiers on top</text>

  <text x="1128" y="606" font-size="13" fill="#7fa0a8" text-anchor="end">nipige.com</text>
</svg>
