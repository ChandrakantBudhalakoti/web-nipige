<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3350"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="v1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="v2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="v3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ab6ff"/><stop offset="1" stop-color="#5b7de0"/></linearGradient>
    <linearGradient id="v4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3a0ff"/><stop offset="1" stop-color="#9a6ae0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="phoneShadow" x="-60%" y="-40%" width="220%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.45"/></filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#050914" flood-opacity="0.45"/></filter>
    <clipPath id="scr2"><rect x="832" y="118" width="256" height="470" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="900" cy="600" r="240" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1"><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/></g>

  <text x="80" y="150" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">MULTI-VENDOR MARKETPLACE</text>
  <text x="78" y="228" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Many restaurants,</text>
  <text x="78" y="290" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">one <tspan fill="#7fa6ff">branded app</tspan></text>
  <text x="80" y="344" font-size="21" fill="#c2cbe6">Isolated vendor data · split payouts · one driver pool.</text>
  <text x="80" y="374" font-size="21" fill="#c2cbe6">Launch it in 14 days, without code.</text>

  <g transform="translate(80,420)">
    <rect width="176" height="46" rx="23" fill="url(#pill)"/>
    <text x="88" y="29" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">50+ vendors, one app</text>
    <g transform="translate(192,0)"><rect width="132" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/><text x="66" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
  </g>

  <!-- phone -->
  <g filter="url(#phoneShadow)"><rect x="818" y="104" width="284" height="498" rx="44" fill="url(#frame)"/></g>
  <rect x="826" y="112" width="268" height="482" rx="37" fill="#05070f"/>
  <rect x="832" y="118" width="256" height="470" rx="30" fill="#f6f7fb"/>
  <g clip-path="url(#scr2)">
    <rect x="832" y="118" width="256" height="86" fill="#2b3a67"/>
    <text x="856" y="150" font-size="11" fill="#aab6dd">YOUR FOOD APP</text>
    <text x="856" y="172" font-size="15" font-weight="700" fill="#ffffff">All restaurants</text>
    <rect x="856" y="186" width="208" height="30" rx="15" fill="#ffffff"/><text x="874" y="206" font-size="11.5" fill="#9aa2bd">Search 50+ vendors</text>
    <!-- vendor list -->
    <g>
      <rect x="856" y="228" width="208" height="60" rx="12" fill="#fff" stroke="#eaeef6"/><rect x="864" y="236" width="44" height="44" rx="9" fill="url(#v1)"/><rect x="920" y="244" width="96" height="9" rx="4.5" fill="#1e2436" opacity=".82"/><rect x="920" y="262" width="60" height="8" rx="4" fill="#8a91a6" opacity=".6"/>
      <rect x="856" y="296" width="208" height="60" rx="12" fill="#fff" stroke="#eaeef6"/><rect x="864" y="304" width="44" height="44" rx="9" fill="url(#v2)"/><rect x="920" y="312" width="96" height="9" rx="4.5" fill="#1e2436" opacity=".82"/><rect x="920" y="330" width="60" height="8" rx="4" fill="#8a91a6" opacity=".6"/>
      <rect x="856" y="364" width="208" height="60" rx="12" fill="#fff" stroke="#eaeef6"/><rect x="864" y="372" width="44" height="44" rx="9" fill="url(#v3)"/><rect x="920" y="380" width="96" height="9" rx="4.5" fill="#1e2436" opacity=".82"/><rect x="920" y="398" width="60" height="8" rx="4" fill="#8a91a6" opacity=".6"/>
      <rect x="856" y="432" width="208" height="60" rx="12" fill="#fff" stroke="#eaeef6"/><rect x="864" y="440" width="44" height="44" rx="9" fill="url(#v4)"/><rect x="920" y="448" width="96" height="9" rx="4.5" fill="#1e2436" opacity=".82"/><rect x="920" y="466" width="60" height="8" rx="4" fill="#8a91a6" opacity=".6"/>
      <rect x="856" y="500" width="208" height="60" rx="12" fill="#fff" stroke="#eaeef6" opacity=".6"/><rect x="864" y="508" width="44" height="44" rx="9" fill="#c2c8d8"/>
    </g>
    <rect x="832" y="556" width="256" height="32" fill="#ffffff"/>
    <g fill="#c2c8d8"><circle cx="880" cy="572" r="4"/><circle cx="960" cy="572" r="4"/><circle cx="1040" cy="572" r="4"/></g><circle cx="920" cy="572" r="5" fill="#ff6a3d"/>
    <rect x="832" y="118" width="256" height="470" rx="30" fill="url(#reflect)"/>
  </g>
  <rect x="932" y="126" width="56" height="16" rx="8" fill="#05070f"/>

  <!-- floating split-payout card -->
  <g filter="url(#cardShadow)" transform="translate(690,420) rotate(4)">
    <rect width="220" height="112" rx="16" fill="#ffffff"/>
    <text x="18" y="30" font-size="12.5" font-weight="700" fill="#1e2436">Order · $32.00</text>
    <text x="18" y="49" font-size="11" fill="#8a91a6">Split automatically</text>
    <rect x="18" y="60" width="184" height="16" rx="8" fill="#eef2fc"/><rect x="18" y="60" width="46" height="16" rx="8" fill="#ff6a3d"/>
    <text x="18" y="98" font-size="11" font-weight="700" fill="#ff6a3d">Your fee $6.40</text>
    <text x="118" y="98" font-size="11" font-weight="700" fill="#3f6fe0">Vendor $25.60</text>
  </g>

  <text x="1128" y="606" font-size="13" fill="#6f7aa0" text-anchor="end">nipige.com</text>
</svg>
