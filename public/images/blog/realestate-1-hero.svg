<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150b26"/><stop offset="0.55" stop-color="#241442"/><stop offset="1" stop-color="#341b54"/></linearGradient>
    <radialGradient id="gP" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gM" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#A855F7" stop-opacity="0.4"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#382a50"/><stop offset="1" stop-color="#150a1f"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2d55"/><stop offset="1" stop-color="#120a1f"/></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="phoneShadow" x="-60%" y="-40%" width="220%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.45"/></filter>
    <clipPath id="scr"><rect x="832" y="118" width="256" height="470" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#gP)" filter="url(#blurL)"/>
  <circle cx="900" cy="600" r="240" fill="url(#gM)" filter="url(#blurL)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1"><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/></g>

  <text x="80" y="140" font-size="15" font-weight="700" letter-spacing="4" fill="#c9a6ff">REAL ESTATE MARKETPLACE</text>
  <text x="78" y="216" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Listings, leases,</text>
  <text x="78" y="278" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">and <tspan fill="#c9a6ff">rent</tspan> — one app</text>
  <text x="80" y="330" font-size="20" fill="#d8cdec">Property listings, tenant portal, maintenance</text>
  <text x="80" y="358" font-size="20" fill="#d8cdec">dispatch, and a built-in CRM.</text>

  <g transform="translate(80,400)">
    <rect width="176" height="44" rx="22" fill="url(#pill)"/>
    <text x="88" y="28" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Rent collection built-in</text>
    <g transform="translate(192,0)"><rect width="140" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/><text x="70" y="28" font-size="14.5" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
  </g>

  <!-- phone -->
  <g filter="url(#phoneShadow)"><rect x="818" y="104" width="284" height="498" rx="44" fill="url(#frame)"/></g>
  <rect x="826" y="112" width="268" height="482" rx="37" fill="#05070f"/>
  <rect x="832" y="118" width="256" height="470" rx="30" fill="#f6f7fb"/>
  <g clip-path="url(#scr)">
    <rect x="832" y="118" width="256" height="86" fill="#3a2d55"/>
    <text x="856" y="150" font-size="11" fill="#c3b3de">YOUR PROPERTY APP</text>
    <text x="856" y="172" font-size="15" font-weight="700" fill="#ffffff">Find a home</text>
    <rect x="856" y="186" width="208" height="30" rx="15" fill="#ffffff"/><text x="874" y="206" font-size="11.5" fill="#9aa2bd">Search by city, price, beds</text>

    <rect x="856" y="228" width="208" height="94" rx="12" fill="#fff" stroke="#eaeef6"/>
    <rect x="864" y="236" width="192" height="52" rx="8" fill="#d8c8f7"/>
    <rect x="864" y="296" width="120" height="9" rx="4.5" fill="#1e2436" opacity=".82"/>
    <rect x="864" y="312" width="80" height="8" rx="4" fill="#8a91a6" opacity=".6"/>

    <rect x="856" y="332" width="208" height="94" rx="12" fill="#fff" stroke="#eaeef6"/>
    <rect x="864" y="340" width="192" height="52" rx="8" fill="#c8d8f7"/>
    <rect x="864" y="400" width="120" height="9" rx="4.5" fill="#1e2436" opacity=".82"/>
    <rect x="864" y="416" width="80" height="8" rx="4" fill="#8a91a6" opacity=".6"/>

    <rect x="856" y="436" width="208" height="94" rx="12" fill="#fff" stroke="#eaeef6" opacity=".7"/>
    <rect x="864" y="444" width="192" height="52" rx="8" fill="#e2d8f7" opacity=".7"/>

    <rect x="832" y="556" width="256" height="32" fill="#ffffff"/>
    <g fill="#c2c8d8"><circle cx="880" cy="572" r="4"/><circle cx="960" cy="572" r="4"/><circle cx="1040" cy="572" r="4"/></g><circle cx="920" cy="572" r="5" fill="#8B5CF6"/>
    <rect x="832" y="118" width="256" height="470" rx="30" fill="url(#reflect)"/>
  </g>
  <rect x="932" y="126" width="56" height="16" rx="8" fill="#05070f"/>

  <text x="1128" y="606" font-size="13" fill="#a596c2" text-anchor="end">nipige.com</text>
</svg>
