<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081222"/><stop offset="1" stop-color="#0B1A30"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.4" r="0.6"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#1B2C46" fill-opacity="0.5"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="cyanglow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22D3EE" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <ellipse cx="900" cy="150" rx="420" ry="240" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="340" fill="url(#cyan)"/>

  <g transform="translate(72,80)">
    <g>
      <rect x="0" y="-24" width="118" height="34" rx="17" fill="#0C1A2E" stroke="#1E3350"/>
      <circle cx="22" cy="-7" r="5" fill="#22D3EE"/>
      <text x="40" y="-2" fill="#9FB6D0" font-size="14" letter-spacing="2" font-weight="600">NIPIGE</text>
    </g>
    <text x="0" y="56" fill="#F1F5F9" font-size="35" font-weight="800" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Launch your services marketplace</text>
    <text x="0" y="96" fill="#A9BED6" font-size="19">No code. $0 platform fees. Live in 14 days.</text>

    <g filter="url(#cyanglow)" transform="translate(0,122)">
      <rect x="0" y="0" width="212" height="52" rx="12" fill="url(#cyan)"/>
      <text x="34" y="33" fill="#04222B" font-size="18" font-weight="800">Book a demo</text>
      <path d="M170 26 h22 M184 19 l8 7 -8 7" stroke="#04222B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="232" y="158" fill="#7E95B2" font-size="14">See the working platform,</text>
    <text x="232" y="176" fill="#7E95B2" font-size="14">not a slide deck.</text>
  </g>

  <g transform="translate(880,70)">
    <g filter="url(#soft)"><rect x="0" y="0" width="248" height="200" rx="18" fill="#0C1B31" stroke="#22385A"/></g>
    <text x="24" y="38" fill="#8AA0BC" font-size="13" letter-spacing="2" font-weight="600">ONE PLATFORM</text>
    <g font-size="15" font-weight="600" fill="#CFE0F1">
      <g transform="translate(24,54)"><rect x="0" y="0" width="200" height="30" rx="9" fill="#0F2138" stroke="#243B58"/><circle cx="18" cy="15" r="6" fill="url(#cyan)"/><text x="36" y="20">Customer app</text></g>
      <g transform="translate(24,90)"><rect x="0" y="0" width="200" height="30" rx="9" fill="#0F2138" stroke="#243B58"/><circle cx="18" cy="15" r="6" fill="#2A9FB8"/><text x="36" y="20">Provider panel</text></g>
      <g transform="translate(24,126)"><rect x="0" y="0" width="200" height="30" rx="9" fill="#0F2138" stroke="#243B58"/><circle cx="18" cy="15" r="6" fill="#2A9FB8"/><text x="36" y="20">Admin console</text></g>
      <g transform="translate(24,162)"><rect x="0" y="0" width="200" height="30" rx="9" fill="#0F2138" stroke="#243B58"/><circle cx="18" cy="15" r="6" fill="#2A9FB8"/><text x="36" y="20">Split payments</text></g>
    </g>
  </g>
</svg>
