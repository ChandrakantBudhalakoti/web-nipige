<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="seg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="seg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ab6ff"/><stop offset="1" stop-color="#5b7de0"/></linearGradient>
    <linearGradient id="seg3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d3a0ff"/><stop offset="1" stop-color="#9a6ae0"/></linearGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="42" flood-color="#03060f" flood-opacity="0.55"/></filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <clipPath id="cardClip"><rect x="648" y="118" width="474" height="480" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1015" cy="165" r="290" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="865" cy="690" r="265" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1"><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="570" x2="1200" y2="570"/></g>

  <text x="80" y="196" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">PAYMENTS &#183; SPLIT &amp; PAYOUTS &#183; 2026</text>
  <text x="78" y="284" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">How marketplace</text>
  <text x="78" y="348" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2"><tspan fill="#7fa6ff">payments</tspan> work</text>
  <text x="80" y="408" font-size="21" fill="#c2cbe6">One payment from the buyer, split between</text>
  <text x="80" y="438" font-size="21" fill="#c2cbe6">the seller and you, paid out on a schedule.</text>

  <g transform="translate(80,486)">
    <rect width="200" height="48" rx="24" fill="url(#pill)" filter="url(#chipShadow)"/>
    <text x="100" y="30" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">split, hold, pay out</text>
  </g>

  <text x="80" y="600" font-size="14" fill="#6f7aa0">A processor like Stripe Connect runs the plumbing. You set the split and the schedule.</text>

  <g filter="url(#cardShadow)"><rect x="648" y="118" width="474" height="480" rx="24" fill="#f7f8fc"/></g>
  <g clip-path="url(#cardClip)">
    <rect x="648" y="118" width="474" height="72" fill="#ffffff"/>
    <rect x="648" y="118" width="474" height="480" fill="url(#cardsheen)" opacity="0.5"/>
  </g>
  <text x="672" y="150" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a91a6">ONE $100 SALE, SPLIT</text>
  <text x="672" y="172" font-size="18" font-weight="800" fill="#1e2436">Who gets what</text>
  <line x1="672" y1="194" x2="1098" y2="194" stroke="#e7ebf4"/>

  <!-- split bar -->
  <text x="672" y="228" font-size="13" font-weight="700" fill="#43506e">Buyer pays</text>
  <text x="1098" y="228" font-size="15" font-weight="800" fill="#1e2436" text-anchor="end">$100.00</text>
  <g>
    <rect x="672" y="240" width="298" height="26" rx="6" fill="url(#seg1)"/>
    <rect x="974" y="240" width="90" height="26" rx="6" fill="url(#seg2)"/>
    <rect x="1068" y="240" width="30" height="26" rx="6" fill="url(#seg3)"/>
  </g>

  <g transform="translate(672,290)">
    <circle cx="8" cy="8" r="8" fill="url(#seg1)"/>
    <text x="26" y="13" font-size="14.5" font-weight="700" fill="#2b3446">Seller receives</text>
    <text x="426" y="13" font-size="15" font-weight="800" fill="#1f8a5e" text-anchor="end">$85.00</text>
  </g>
  <g transform="translate(672,326)">
    <circle cx="8" cy="8" r="8" fill="url(#seg2)"/>
    <text x="26" y="13" font-size="14.5" font-weight="700" fill="#2b3446">Your commission (15%)</text>
    <text x="426" y="13" font-size="15" font-weight="800" fill="#2f4a8a" text-anchor="end">$15.00</text>
  </g>
  <g transform="translate(672,362)">
    <circle cx="8" cy="8" r="8" fill="url(#seg3)"/>
    <text x="26" y="13" font-size="14.5" font-weight="700" fill="#2b3446">Processor fee (approx)</text>
    <text x="426" y="13" font-size="15" font-weight="800" fill="#6b4a9a" text-anchor="end">$3.20</text>
  </g>

  <line x1="672" y1="398" x2="1098" y2="398" stroke="#e7ebf4"/>
  <text x="672" y="428" font-size="13" font-weight="700" fill="#43506e">Payout to seller</text>
  <text x="1098" y="428" font-size="13.5" font-weight="700" fill="#43506e" text-anchor="end">instant, weekly, or on delivery</text>

  <rect x="672" y="452" width="426" height="114" rx="14" fill="#eafaf2" stroke="#c7ecda"/>
  <text x="692" y="486" font-size="14" font-weight="800" fill="#1f8a5e">Platform fee to Nipige</text>
  <text x="1078" y="490" font-size="30" font-weight="800" fill="#1f8a5e" text-anchor="end">$0</text>
  <text x="692" y="516" font-size="12.5" fill="#3f7a63">You keep your full commission. The only per-sale</text>
  <text x="692" y="536" font-size="12.5" fill="#3f7a63">cost is the processor's standard rate.</text>
</svg>
