<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f8fc"/><stop offset="1" stop-color="#eef1f9"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3350"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
    <linearGradient id="promo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a4d"/><stop offset="1" stop-color="#ff5a86"/></linearGradient>
    <linearGradient id="food1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="food2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="food3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ab6ff"/><stop offset="1" stop-color="#5b7de0"/></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="phoneShadow" x="-60%" y="-40%" width="220%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.45"/></filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#050914" flood-opacity="0.45"/></filter>
    <clipPath id="scr"><rect x="832" y="118" width="256" height="470" rx="30"/></clipPath>
  </defs>

  <!-- background + glows -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#glowB)" filter="url(#blurL)"/>
  <circle cx="900" cy="600" r="240" fill="url(#glowO)" filter="url(#blurL)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- ===================== COPY ===================== -->
  <text x="80" y="150" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">ON-DEMAND FOOD DELIVERY</text>
  <text x="78" y="228" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Launch your own</text>
  <text x="78" y="292" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">food delivery <tspan fill="#7fa6ff">app</tspan></text>
  <text x="80" y="344" font-size="21" fill="#c2cbe6">Customer, restaurant &amp; driver apps + admin —</text>
  <text x="80" y="374" font-size="21" fill="#c2cbe6">branded, no code, live in 14 days.</text>

  <!-- pills -->
  <g transform="translate(80,420)">
    <rect width="150" height="46" rx="23" fill="url(#pill)"/>
    <text x="75" y="29" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">From $899/mo</text>
    <g transform="translate(166,0)"><rect width="132" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/><text x="66" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
    <g transform="translate(314,0)"><rect width="96" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/><text x="48" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">No code</text></g>
  </g>

  <!-- ===================== PHONE ===================== -->
  <g filter="url(#phoneShadow)">
    <rect x="818" y="104" width="284" height="498" rx="44" fill="url(#frame)"/>
  </g>
  <rect x="826" y="112" width="268" height="482" rx="37" fill="#05070f"/>
  <rect x="832" y="118" width="256" height="470" rx="30" fill="#f6f7fb"/>

  <!-- screen content -->
  <g clip-path="url(#scr)">
    <!-- header -->
    <rect x="832" y="118" width="256" height="92" fill="#2b3a67"/>
    <text x="856" y="152" font-size="11" fill="#aab6dd">DELIVER TO</text>
    <text x="856" y="172" font-size="15" font-weight="700" fill="#ffffff">Downtown · Now</text>
    <circle cx="1064" cy="160" r="15" fill="#ffffff" fill-opacity="0.14"/>
    <!-- search -->
    <rect x="856" y="192" width="208" height="34" rx="17" fill="#ffffff"/>
    <circle cx="878" cy="209" r="6" fill="none" stroke="#9aa2bd" stroke-width="2"/><line x1="882" y1="213" x2="887" y2="218" stroke="#9aa2bd" stroke-width="2"/>
    <text x="896" y="214" font-size="12" fill="#9aa2bd">Search restaurants</text>
    <!-- promo -->
    <rect x="856" y="238" width="208" height="70" rx="14" fill="url(#promo)"/>
    <text x="874" y="270" font-size="15" font-weight="800" fill="#ffffff">Free delivery today</text>
    <text x="874" y="290" font-size="11" fill="#ffe4d8">On orders over $20</text>
    <!-- section title -->
    <text x="856" y="336" font-size="13" font-weight="700" fill="#1e2436">Popular near you</text>
    <!-- restaurant card 1 -->
    <rect x="856" y="348" width="208" height="76" rx="14" fill="#ffffff" stroke="#eaeef6"/>
    <rect x="864" y="356" width="60" height="60" rx="10" fill="url(#food1)"/>
    <text x="936" y="376" font-size="13" font-weight="700" fill="#1e2436">Bella Napoli</text>
    <text x="936" y="395" font-size="10.5" fill="#8a91a6">Italian · $$</text>
    <rect x="936" y="402" width="70" height="16" rx="8" fill="#eef7f1"/><text x="946" y="414" font-size="10" font-weight="700" fill="#1f9f6e">★ 4.8 · 25m</text>
    <!-- restaurant card 2 -->
    <rect x="856" y="432" width="208" height="76" rx="14" fill="#ffffff" stroke="#eaeef6"/>
    <rect x="864" y="440" width="60" height="60" rx="10" fill="url(#food2)"/>
    <text x="936" y="460" font-size="13" font-weight="700" fill="#1e2436">Green Bowl</text>
    <text x="936" y="479" font-size="10.5" fill="#8a91a6">Healthy · $</text>
    <rect x="936" y="486" width="70" height="16" rx="8" fill="#eef7f1"/><text x="946" y="498" font-size="10" font-weight="700" fill="#1f9f6e">★ 4.9 · 18m</text>
    <!-- restaurant card 3 (peeking) -->
    <rect x="856" y="516" width="208" height="76" rx="14" fill="#ffffff" stroke="#eaeef6"/>
    <rect x="864" y="524" width="60" height="60" rx="10" fill="url(#food3)"/>
    <text x="936" y="544" font-size="13" font-weight="700" fill="#1e2436">Sushi Line</text>
    <!-- bottom nav -->
    <rect x="832" y="556" width="256" height="32" fill="#ffffff"/>
    <g fill="#c2c8d8"><circle cx="880" cy="572" r="4"/><circle cx="960" cy="572" r="4"/><circle cx="1040" cy="572" r="4"/></g>
    <circle cx="920" cy="572" r="5" fill="#ff6a3d"/>
    <!-- screen sheen -->
    <rect x="832" y="118" width="256" height="470" rx="30" fill="url(#reflect)"/>
  </g>
  <!-- notch -->
  <rect x="932" y="126" width="56" height="16" rx="8" fill="#05070f"/>

  <!-- ============ floating glass cards ============ -->
  <g filter="url(#cardShadow)" transform="translate(720,196) rotate(-5)">
    <rect width="196" height="66" rx="16" fill="#ffffff"/>
    <circle cx="34" cy="33" r="16" fill="#e7f6ef"/><path d="M28 33 l4 4 l8 -9" stroke="#1f9f6e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="29" font-size="12.5" font-weight="700" fill="#1e2436">New order received</text>
    <text x="60" y="48" font-size="12" fill="#8a91a6">Bella Napoli · <tspan font-weight="700" fill="#1e2436">$24.50</tspan></text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(700,452) rotate(4)">
    <rect width="210" height="92" rx="16" fill="#ffffff"/>
    <rect x="14" y="14" width="70" height="64" rx="10" fill="#e9eef8"/>
    <path d="M22 66 C 38 40, 54 52, 74 26" stroke="#3f6fe0" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="26" r="5" fill="#ff6a3d"/><circle cx="22" cy="66" r="4" fill="#3f6fe0"/>
    <text x="98" y="36" font-size="12.5" font-weight="700" fill="#1e2436">Driver on the way</text>
    <text x="98" y="55" font-size="12" fill="#8a91a6">Live GPS tracking</text>
    <rect x="98" y="64" width="96" height="16" rx="8" fill="#eef2fc"/><text x="108" y="76" font-size="10.5" font-weight="700" fill="#3f6fe0">Arriving in 8 min</text>
  </g>

  <text x="1128" y="606" font-size="13" fill="#6f7aa0" text-anchor="end">nipige.com</text>
</svg>
