<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="cv" cx="50%" cy="0%" r="120%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1eef8"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2a1c48" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#cv)"/>
  <text x="72" y="76" font-size="32" font-weight="800" fill="#1a1030" letter-spacing="-.6">What a real estate marketplace platform needs</text>
  <text x="72" y="108" font-size="16" fill="#6b7280">Beyond a listings page: applications, rent, maintenance, and a CRM &#8212; in one system.</text>

  <g>
    <g filter="url(#soft)"><rect x="72" y="150" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="96" y="174" width="40" height="40" rx="10" fill="#8B5CF6"/><text x="116" y="199" font-size="19" text-anchor="middle" fill="#fff">&#127968;</text>
    <text x="150" y="192" font-size="16" font-weight="700" fill="#1a1030">Property listings</text>
    <text x="96" y="240" font-size="12.5" fill="#6b7280">Filterable search &#8212; location, price,</text>
    <text x="96" y="258" font-size="12.5" fill="#6b7280">bedrooms, amenities, photos, tours.</text>

    <g filter="url(#soft)"><rect x="435" y="150" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="459" y="174" width="40" height="40" rx="10" fill="#8B5CF6"/><text x="479" y="199" font-size="19" text-anchor="middle" fill="#fff">&#128203;</text>
    <text x="513" y="192" font-size="16" font-weight="700" fill="#1a1030">Applications &amp; leases</text>
    <text x="459" y="240" font-size="12.5" fill="#6b7280">Online applications, document</text>
    <text x="459" y="258" font-size="12.5" fill="#6b7280">uploads, e-signatures, tracking.</text>

    <g filter="url(#soft)"><rect x="798" y="150" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="822" y="174" width="40" height="40" rx="10" fill="#8B5CF6"/><text x="842" y="199" font-size="19" text-anchor="middle" fill="#fff">&#128179;</text>
    <text x="876" y="192" font-size="16" font-weight="700" fill="#1a1030">Rent collection</text>
    <text x="822" y="240" font-size="12.5" fill="#6b7280">Automated collection, late fees,</text>
    <text x="822" y="258" font-size="12.5" fill="#6b7280">payment history, multi-method pay.</text>

    <g filter="url(#soft)"><rect x="72" y="308" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="96" y="332" width="40" height="40" rx="10" fill="#A855F7"/><text x="116" y="357" font-size="19" text-anchor="middle" fill="#fff">&#128295;</text>
    <text x="150" y="350" font-size="16" font-weight="700" fill="#1a1030">Maintenance dispatch</text>
    <text x="96" y="398" font-size="12.5" fill="#6b7280">Tenants submit requests, routed</text>
    <text x="96" y="416" font-size="12.5" fill="#6b7280">to providers, tracked to resolution.</text>

    <g filter="url(#soft)"><rect x="435" y="308" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="459" y="332" width="40" height="40" rx="10" fill="#A855F7"/><text x="479" y="357" font-size="19" text-anchor="middle" fill="#fff">&#128101;</text>
    <text x="513" y="350" font-size="16" font-weight="700" fill="#1a1030">Tenant portal &amp; CRM</text>
    <text x="459" y="398" font-size="12.5" fill="#6b7280">Profiles, communication history,</text>
    <text x="459" y="416" font-size="12.5" fill="#6b7280">document storage, self-service.</text>

    <g filter="url(#soft)"><rect x="798" y="308" width="330" height="132" rx="16" fill="#ffffff" stroke="#eee6fa"/></g>
    <rect x="822" y="332" width="40" height="40" rx="10" fill="#A855F7"/><text x="842" y="357" font-size="19" text-anchor="middle" fill="#fff">&#128202;</text>
    <text x="876" y="350" font-size="16" font-weight="700" fill="#1a1030">Portfolio analytics</text>
    <text x="822" y="398" font-size="12.5" fill="#6b7280">Occupancy, revenue tracking,</text>
    <text x="822" y="416" font-size="12.5" fill="#6b7280">expenses, financial reports.</text>
  </g>

  <text x="72" y="500" font-size="15" fill="#6b7280">Manage residential, commercial, and mixed portfolios from one dashboard.</text>
  <text x="1128" y="608" font-size="13" fill="#a99cc2" text-anchor="end">nipige.com</text>
</svg>
