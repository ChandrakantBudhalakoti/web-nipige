<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="42" flood-color="#03060f" flood-opacity="0.55"/></filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <clipPath id="cardClip"><rect x="648" y="118" width="474" height="480" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1015" cy="165" r="290" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="865" cy="690" r="265" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1"><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="570" x2="1200" y2="570"/></g>

  <!-- LEFT: copy -->
  <text x="80" y="196" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">RESTAURANT APP BUILDER &#183; 2026</text>
  <text x="78" y="284" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2">Own your app,</text>
  <text x="78" y="352" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2">own your <tspan fill="#7fa6ff">margin</tspan></text>
  <text x="80" y="412" font-size="21" fill="#c2cbe6">Launch a branded ordering and delivery app,</text>
  <text x="80" y="442" font-size="21" fill="#c2cbe6">without code or an aggregator's cut.</text>

  <g transform="translate(80,490)">
    <rect width="176" height="48" rx="24" fill="url(#pill)" filter="url(#chipShadow)"/>
    <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="30" cy="24" r="8.5"/><path d="M30 20 l0 4.5 l3.5 2"/></g>
    <text x="108" y="30" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">live in ~14 days</text>
    <g transform="translate(192,0)"><rect width="168" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><circle cx="30" cy="24" r="8" fill="none" stroke="#7ad0a8" stroke-width="2.4"/><path d="M26 24 l3 3 l6 -7" fill="none" stroke="#7ad0a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
  </g>

  <text x="80" y="620" font-size="14" fill="#6f7aa0">Aggregator fees: widely reported 15-30% per order (industry range).</text>

  <!-- RIGHT: per-order fee comparison card -->
  <g filter="url(#cardShadow)"><rect x="648" y="118" width="474" height="480" rx="24" fill="#f7f8fc"/></g>
  <g clip-path="url(#cardClip)">
    <rect x="648" y="118" width="474" height="72" fill="#ffffff"/>
    <rect x="648" y="118" width="474" height="480" fill="url(#cardsheen)" opacity="0.5"/>
  </g>
  <circle cx="686" cy="154" r="16" fill="#fff0e8"/><text x="686" y="161" font-size="17" text-anchor="middle">&#128176;</text>
  <text x="716" y="148" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a91a6">WHAT EACH ORDER COSTS</text>
  <text x="716" y="170" font-size="18" font-weight="800" fill="#1e2436">Aggregator vs your own app</text>
  <line x1="672" y1="194" x2="1098" y2="194" stroke="#e7ebf4"/>

  <!-- chart -->
  <g>
    <g stroke="#eef1f8" stroke-width="1"><line x1="700" y1="290" x2="1070" y2="290"/><line x1="700" y1="360" x2="1070" y2="360"/><line x1="700" y1="430" x2="1070" y2="430"/></g>
    <line x1="700" y1="486" x2="1070" y2="486" stroke="#d7dcea" stroke-width="1.5"/>

    <rect x="762" y="286" width="96" height="200" rx="8" fill="url(#barOrange)"/>
    <rect x="762" y="286" width="96" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="810" y="274" font-size="19" font-weight="800" fill="#1e2436" text-anchor="middle">15-30%</text>
    <text x="810" y="508" font-size="13" font-weight="700" fill="#5b6480" text-anchor="middle">Aggregator</text>
    <text x="810" y="525" font-size="11.5" fill="#98a1b8" text-anchor="middle">per order</text>

    <rect x="916" y="470" width="96" height="16" rx="8" fill="url(#barGreen)"/>
    <text x="964" y="458" font-size="19" font-weight="800" fill="#1e2436" text-anchor="middle">$0</text>
    <text x="964" y="508" font-size="13" font-weight="700" fill="#5b6480" text-anchor="middle">Your own app</text>
    <text x="964" y="525" font-size="11.5" fill="#98a1b8" text-anchor="middle">platform fees</text>
  </g>

  <!-- callout, inside the card -->
  <rect x="672" y="540" width="426" height="50" rx="12" fill="#eafaf1" stroke="#b8e6cd"/>
  <rect x="690" y="553" width="26" height="26" rx="7" fill="url(#barGreen)"/>
  <path d="M696 566 l3 3 l6 -8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="730" y="561" font-size="13.5" font-weight="800" fill="#1f7a4d">Your own app keeps every order's margin</text>
  <text x="730" y="579" font-size="12" font-weight="500" fill="#5a8a70">You pay only your payment processor's standard rate.</text>
</svg>
