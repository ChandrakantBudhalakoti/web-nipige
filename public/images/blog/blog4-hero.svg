<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070C16"/><stop offset="1" stop-color="#0B1628"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101F38"/><stop offset="1" stop-color="#0B1524"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.15"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.15"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.3" fill="#1B2C46" fill-opacity="0.5"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="cyanglow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#22D3EE" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#dots)"/>
  <ellipse cx="600" cy="355" rx="520" ry="310" fill="url(#glow)"/>

  <g transform="translate(0,35)">
  <g transform="translate(600,66)" text-anchor="middle">
    <rect x="-190" y="-21" width="380" height="42" rx="21" fill="#0C1A2E" stroke="#1E3350"/>
    <circle cx="-158" cy="0" r="5" fill="#22D3EE"/>
    <text x="14" y="5" fill="#9FB6D0" font-size="17" letter-spacing="3" font-weight="600">FOOD DELIVERY MARKETPLACE</text>
  </g>

  <g stroke="url(#line)" stroke-width="2.5" fill="none">
    <path d="M300 300 C 380 300, 400 315, 470 315"/>
    <path d="M300 360 C 380 360, 400 345, 470 345"/>
    <path d="M730 330 C 800 330, 820 300, 900 300"/>
    <path d="M730 330 C 800 330, 820 360, 900 360"/>
  </g>
  <g fill="#22D3EE" filter="url(#cyanglow)">
    <circle cx="415" cy="322" r="4"/><circle cx="415" cy="338" r="4"/>
    <circle cx="815" cy="315" r="4"/><circle cx="815" cy="345" r="4"/>
  </g>

  <!-- LEFT: Customers -->
  <g filter="url(#soft)"><rect x="110" y="250" width="190" height="160" rx="18" fill="url(#card)" stroke="#20344F"/></g>
  <text x="130" y="284" fill="#8AA0BC" font-size="15" letter-spacing="2" font-weight="600">CUSTOMERS</text>
  <g transform="translate(130,300)">
    <g><rect x="0" y="0" width="150" height="28" rx="8" fill="#0E2035" stroke="#243B58"/><circle cx="18" cy="14" r="8" fill="url(#cyan)"/><rect x="36" y="9" width="86" height="9" rx="4" fill="#2A415F"/></g>
    <g transform="translate(0,38)"><rect x="0" y="0" width="150" height="28" rx="8" fill="#0E2035" stroke="#243B58"/><circle cx="18" cy="14" r="8" fill="#2A9FB8"/><rect x="36" y="9" width="70" height="9" rx="4" fill="#2A415F"/></g>
    <g transform="translate(0,76)"><rect x="0" y="0" width="150" height="28" rx="8" fill="#0E2035" stroke="#243B58"/><circle cx="18" cy="14" r="8" fill="#2A9FB8"/><rect x="36" y="9" width="94" height="9" rx="4" fill="#2A415F"/></g>
  </g>

  <!-- CENTER: Your Food Delivery Marketplace -->
  <g filter="url(#soft)"><rect x="470" y="150" width="260" height="330" rx="22" fill="url(#card)" stroke="#2b466a"/></g>
  <g transform="translate(600,190)" text-anchor="middle">
    <circle cx="-118" cy="-4" r="7" fill="url(#cyan)"/>
    <text x="6" y="2" fill="#F1F5F9" font-size="18" font-weight="800" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Your Food Delivery App</text>
  </g>
  <g transform="translate(494,214)">
    <rect x="0" y="0" width="212" height="176" rx="12" fill="#0A1730" stroke="#223754"/>
    <rect x="0" y="0" width="212" height="30" rx="12" fill="#0E2038"/>
    <rect x="0" y="18" width="212" height="12" fill="#0E2038"/>
    <circle cx="16" cy="15" r="4" fill="#2A415F"/><circle cx="30" cy="15" r="4" fill="#2A415F"/><circle cx="44" cy="15" r="4" fill="#2A415F"/>
    <rect x="70" y="9" width="128" height="12" rx="6" fill="#152A47"/>
    <g transform="translate(14,44)"><rect x="0" y="0" width="184" height="36" rx="9" fill="#0F2138" stroke="#20344F"/><circle cx="20" cy="18" r="10" fill="url(#cyan)"/><rect x="40" y="9" width="90" height="8" rx="4" fill="#33506f"/><rect x="40" y="22" width="60" height="7" rx="3.5" fill="#243b58"/><rect x="150" y="12" width="24" height="12" rx="6" fill="#123247"/></g>
    <g transform="translate(14,88)"><rect x="0" y="0" width="184" height="36" rx="9" fill="#0F2138" stroke="#20344F"/><circle cx="20" cy="18" r="10" fill="#2A9FB8"/><rect x="40" y="9" width="76" height="8" rx="4" fill="#33506f"/><rect x="40" y="22" width="52" height="7" rx="3.5" fill="#243b58"/><rect x="150" y="12" width="24" height="12" rx="6" fill="#123247"/></g>
    <g transform="translate(14,132)"><rect x="0" y="0" width="184" height="30" rx="9" fill="#0F2138" stroke="#20344F"/><circle cx="18" cy="15" r="8" fill="#2A9FB8"/><rect x="36" y="8" width="84" height="7" rx="3.5" fill="#33506f"/><rect x="36" y="19" width="48" height="6" rx="3" fill="#243b58"/></g>
  </g>
  <g transform="translate(600,452)" text-anchor="middle" font-size="11" font-weight="600">
    <g>
      <rect x="-118" y="-14" width="58" height="28" rx="14" fill="#0C1C33" stroke="#254063"/>
      <rect x="-54" y="-14" width="64" height="28" rx="14" fill="#0C1C33" stroke="#254063"/>
      <rect x="16" y="-14" width="48" height="28" rx="14" fill="#0C1C33" stroke="#254063"/>
      <rect x="70" y="-14" width="52" height="28" rx="14" fill="#0C1C33" stroke="#254063"/>
    </g>
    <text x="-89" y="4" fill="#BFD4EA">Customer</text>
    <text x="-22" y="4" fill="#BFD4EA">Restaurant</text>
    <text x="40" y="4" fill="#BFD4EA">Driver</text>
    <text x="96" y="4" fill="#BFD4EA">Admin</text>
  </g>

  <!-- RIGHT: Restaurants + Drivers -->
  <g filter="url(#soft)"><rect x="900" y="240" width="190" height="180" rx="18" fill="url(#card)" stroke="#20344F"/></g>
  <g transform="translate(920,272)">
    <text x="0" y="0" fill="#8AA0BC" font-size="15" letter-spacing="2" font-weight="600">RESTAURANTS</text>
    <g transform="translate(0,16)">
      <g><rect x="0" y="0" width="70" height="52" rx="10" fill="#0E2035" stroke="#243B58"/><rect x="18" y="16" width="34" height="24" rx="5" fill="#33506f"/><circle cx="35" cy="14" r="6" fill="#22D3EE"/></g>
      <g transform="translate(80,0)"><rect x="0" y="0" width="70" height="52" rx="10" fill="#0E2035" stroke="#243B58"/><rect x="18" y="16" width="34" height="24" rx="5" fill="#33506f"/><circle cx="35" cy="14" r="6" fill="#2A9FB8"/></g>
      <g transform="translate(0,62)"><rect x="0" y="0" width="70" height="52" rx="10" fill="#0E2035" stroke="#243B58"/><rect x="18" y="16" width="34" height="24" rx="5" fill="#33506f"/><circle cx="35" cy="14" r="6" fill="#2A9FB8"/></g>
      <g transform="translate(80,62)"><rect x="0" y="0" width="70" height="52" rx="10" fill="#0C1C33" stroke="#254063"/><text x="35" y="32" text-anchor="middle" fill="#22D3EE" font-size="15" font-weight="800">+30</text></g>
    </g>
  </g>

  <g transform="translate(600,560)" text-anchor="middle">
    <g filter="url(#soft)"><rect x="-330" y="-30" width="660" height="60" rx="16" fill="url(#card)" stroke="#20344F"/></g>
    <text x="-250" y="-4" text-anchor="middle" fill="#22D3EE" font-size="19" font-weight="800">$0</text>
    <text x="-250" y="16" text-anchor="middle" fill="#8AA0BC" font-size="12">platform fees</text>
    <line x1="-140" y1="-18" x2="-140" y2="18" stroke="#20344F"/>
    <text x="-40" y="-4" text-anchor="middle" fill="#F1F5F9" font-size="19" font-weight="800">14 days</text>
    <text x="-40" y="16" text-anchor="middle" fill="#8AA0BC" font-size="12">to launch</text>
    <line x1="70" y1="-18" x2="70" y2="18" stroke="#20344F"/>
    <text x="185" y="-4" text-anchor="middle" fill="#F1F5F9" font-size="19" font-weight="800">no code</text>
    <text x="185" y="16" text-anchor="middle" fill="#8AA0BC" font-size="12">white-label, your brand</text>
  </g>
  </g>
</svg>
