<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.6" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="g3O" cx="0.72" cy="0.4" r="0.6"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.4"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <filter id="blur3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <filter id="ctaShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#ff6a3d" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg3)"/>
  <ellipse cx="900" cy="150" rx="420" ry="240" fill="url(#g3O)" filter="url(#blur3)"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="url(#cta)"/>

  <text x="72" y="60" font-size="14" font-weight="700" letter-spacing="4" fill="#ff9166">ECONOMICS THAT IMPROVE AT SCALE</text>
  <text x="70" y="112" font-size="37" font-weight="800" fill="#ffffff" letter-spacing="-1">Scale your marketplace</text>
  <text x="70" y="154" font-size="37" font-weight="800" fill="#ffffff" letter-spacing="-1">on <tspan fill="#7fa6ff">Nipige</tspan></text>
  <text x="72" y="196" font-size="18" font-weight="500" fill="#a9bed6">Managed platform. Native apps. $0 platform fees as you grow.</text>

  <g filter="url(#ctaShadow)" transform="translate(72,224)">
    <rect x="0" y="0" width="200" height="56" rx="14" fill="url(#cta)"/>
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#ffffff" fill-opacity="0.14"/>
    <text x="100" y="35" font-size="18" font-weight="800" fill="#2a1408" text-anchor="middle">Book a demo</text>
  </g>
  <text x="292" y="246" font-size="14" font-weight="600" fill="#8fa0c6">Spend your time on</text>
  <text x="292" y="266" font-size="14" font-weight="600" fill="#8fa0c6">liquidity, not servers.</text>

  <g transform="translate(880,88)">
    <g filter="url(#soft)"><rect x="0" y="0" width="248" height="164" rx="18" fill="#0e1631" stroke="#28385c"/></g>
    <text x="24" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#8aa0bc">SCALES WITH YOU</text>
    <g font-size="14.5" font-weight="600" fill="#cfe0f1">
      <g transform="translate(24,52)"><circle cx="13" cy="15" r="11" fill="#0f3423"/><path d="M8 15 l3 3 l6 -7" fill="none" stroke="url(#grn)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="20">Managed infrastructure</text></g>
      <g transform="translate(24,88)"><circle cx="13" cy="15" r="11" fill="#0f3423"/><path d="M8 15 l3 3 l6 -7" fill="none" stroke="url(#grn)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="20">Native apps, both sides</text></g>
      <g transform="translate(24,124)"><circle cx="13" cy="15" r="11" fill="#0f3423"/><path d="M8 15 l3 3 l6 -7" fill="none" stroke="url(#grn)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="20">$0 fees as GMV grows</text></g>
    </g>
  </g>
</svg>
