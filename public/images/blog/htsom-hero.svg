<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="sell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="buy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ab6ff"/><stop offset="1" stop-color="#5b7de0"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="42" flood-color="#03060f" flood-opacity="0.55"/></filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <clipPath id="cardClip"><rect x="648" y="118" width="474" height="480" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1015" cy="165" r="290" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="865" cy="690" r="265" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1"><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="570" x2="1200" y2="570"/></g>

  <!-- LEFT copy -->
  <text x="80" y="196" font-size="15" font-weight="700" letter-spacing="3" fill="#ff9166">HOW TO START A MARKETPLACE &#183; 2026</text>
  <text x="78" y="284" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2">Start a marketplace</text>
  <text x="78" y="352" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2">in <tspan fill="#7fa6ff">7 steps</tspan></text>
  <text x="80" y="412" font-size="21" fill="#c2cbe6">Pick a niche, choose a model, and recruit</text>
  <text x="80" y="442" font-size="21" fill="#c2cbe6">your first sellers to beat the cold start.</text>

  <g transform="translate(80,490)">
    <rect width="150" height="48" rx="24" fill="url(#pill)" filter="url(#chipShadow)"/>
    <text x="75" y="30" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">no code</text>
    <g transform="translate(166,0)"><rect width="168" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><circle cx="30" cy="24" r="8" fill="none" stroke="#7ad0a8" stroke-width="2.4"/><path d="M26 24 l3 3 l6 -7" fill="none" stroke="#7ad0a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
  </g>

  <text x="80" y="620" font-size="14" fill="#6f7aa0">Marketplaces drove ~83% of global eCommerce GMV in 2025 (CS-Cart).</text>

  <!-- RIGHT: two-sided marketplace diagram card -->
  <g filter="url(#cardShadow)"><rect x="648" y="118" width="474" height="480" rx="24" fill="#f7f8fc"/></g>
  <g clip-path="url(#cardClip)">
    <rect x="648" y="118" width="474" height="72" fill="#ffffff"/>
    <rect x="648" y="118" width="474" height="480" fill="url(#cardsheen)" opacity="0.5"/>
  </g>
  <circle cx="686" cy="154" r="16" fill="#eef1fb"/><path d="M680 158 l0 -6 a6 6 0 0 1 12 0 l0 6 M683 152 a3 3 0 1 1 6 0" fill="none" stroke="#5b7de0" stroke-width="2"/>
  <text x="716" y="150" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a91a6">TWO-SIDED MARKETPLACE</text>
  <text x="716" y="172" font-size="18" font-weight="800" fill="#1e2436">Sellers, platform, buyers</text>
  <line x1="672" y1="194" x2="1098" y2="194" stroke="#e7ebf4"/>

  <!-- connector lines (behind nodes), no arrowheads -->
  <g stroke="#cdd6ea" stroke-width="2" fill="none">
    <path d="M770 262 C 830 262 830 360 885 360"/>
    <path d="M770 332 C 840 332 840 360 885 360"/>
    <path d="M770 402 C 830 402 830 360 885 360"/>
    <path d="M945 360 C 1000 360 1000 262 1060 262"/>
    <path d="M945 360 C 1010 360 1010 332 1060 332"/>
    <path d="M945 360 C 1000 360 1000 402 1060 402"/>
  </g>

  <!-- SELLERS column -->
  <text x="736" y="228" font-size="12" font-weight="700" letter-spacing="1.5" fill="#39a37a" text-anchor="middle">SELLERS</text>
  <g>
    <rect x="700" y="246" width="72" height="34" rx="9" fill="url(#sell)"/><text x="736" y="268" font-size="13" font-weight="700" fill="#0e2a20" text-anchor="middle">Seller</text>
    <rect x="700" y="316" width="72" height="34" rx="9" fill="url(#sell)"/><text x="736" y="338" font-size="13" font-weight="700" fill="#0e2a20" text-anchor="middle">Seller</text>
    <rect x="700" y="386" width="72" height="34" rx="9" fill="url(#sell)"/><text x="736" y="408" font-size="13" font-weight="700" fill="#0e2a20" text-anchor="middle">Seller</text>
  </g>

  <!-- PLATFORM hub -->
  <circle cx="915" cy="360" r="46" fill="url(#hub)"/>
  <circle cx="915" cy="360" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="915" y="356" font-size="12" font-weight="800" fill="#2a1408" text-anchor="middle">YOUR</text>
  <text x="915" y="372" font-size="12" font-weight="800" fill="#2a1408" text-anchor="middle">PLATFORM</text>

  <!-- BUYERS column -->
  <text x="1096" y="228" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b7de0" text-anchor="middle">BUYERS</text>
  <g>
    <rect x="1060" y="246" width="72" height="34" rx="9" fill="url(#buy)"/><text x="1096" y="268" font-size="13" font-weight="700" fill="#12203f" text-anchor="middle">Buyer</text>
    <rect x="1060" y="316" width="72" height="34" rx="9" fill="url(#buy)"/><text x="1096" y="338" font-size="13" font-weight="700" fill="#12203f" text-anchor="middle">Buyer</text>
    <rect x="1060" y="386" width="72" height="34" rx="9" fill="url(#buy)"/><text x="1096" y="408" font-size="13" font-weight="700" fill="#12203f" text-anchor="middle">Buyer</text>
  </g>

  <!-- callout inside card -->
  <rect x="672" y="470" width="426" height="98" rx="12" fill="#fff2ec" stroke="#ffd6c2"/>
  <rect x="690" y="488" width="26" height="26" rx="7" fill="url(#pill)"/>
  <path d="M705 492 l-6 10 h4 l-2 8 l8 -12 h-4 z" fill="#ffffff"/>
  <text x="730" y="498" font-size="13.5" font-weight="800" fill="#c2410c">The cold-start problem</text>
  <text x="730" y="518" font-size="12.5" font-weight="500" fill="#9a6a52">Neither side shows up without the other.</text>
  <text x="730" y="540" font-size="12.5" font-weight="500" fill="#9a6a52">Seed sellers first, in one tight niche,</text>
  <text x="730" y="558" font-size="12.5" font-weight="500" fill="#9a6a52">and buyers follow a stocked marketplace.</text>
</svg>
