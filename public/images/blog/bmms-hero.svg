<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ad0a8"/><stop offset="1" stop-color="#39a37a"/></linearGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="42" flood-color="#03060f" flood-opacity="0.55"/></filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <clipPath id="cardClip"><rect x="648" y="118" width="474" height="480" rx="24"/></clipPath>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1015" cy="165" r="290" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="865" cy="690" r="265" fill="url(#gO)" filter="url(#blurL)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1"><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="570" x2="1200" y2="570"/></g>

  <text x="80" y="190" font-size="15" font-weight="700" letter-spacing="3.5" fill="#ff9166">MULTI-VENDOR MARKETPLACE SOFTWARE &#183; 2026</text>
  <text x="78" y="278" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-2">The best one is</text>
  <text x="78" y="344" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-2">the one that <tspan fill="#7fa6ff">fits you</tspan></text>
  <text x="80" y="404" font-size="21" fill="#c2cbe6">7 platforms compared by build method, apps,</text>
  <text x="80" y="434" font-size="21" fill="#c2cbe6">fees, and who each one is actually for.</text>

  <g transform="translate(80,484)">
    <rect width="150" height="48" rx="24" fill="url(#pill)" filter="url(#chipShadow)"/>
    <text x="75" y="30" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7 platforms</text>
    <g transform="translate(166,0)"><rect width="180" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="90" y="29" font-size="15" font-weight="600" fill="#e7ecfa" text-anchor="middle">honest buying guide</text></g>
  </g>
  <text x="80" y="616" font-size="14" fill="#6f7aa0">Compared by how you build and run it, not by feature-count.</text>

  <!-- RIGHT: routing card -->
  <g filter="url(#cardShadow)"><rect x="648" y="118" width="474" height="480" rx="24" fill="#f7f8fc"/></g>
  <g clip-path="url(#cardClip)">
    <rect x="648" y="118" width="474" height="72" fill="#ffffff"/>
    <rect x="648" y="118" width="474" height="480" fill="url(#cardsheen)" opacity="0.5"/>
  </g>
  <circle cx="686" cy="154" r="16" fill="#eaf1ff"/><text x="686" y="160" font-size="16" text-anchor="middle">&#129517;</text>
  <text x="716" y="148" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a91a6">PICK BY HOW YOU BUILD</text>
  <text x="716" y="170" font-size="18" font-weight="800" fill="#1e2436">Build method routes the choice</text>
  <line x1="672" y1="194" x2="1098" y2="194" stroke="#e7ebf4"/>

  <g font-size="15">
    <g transform="translate(686,232)"><rect x="-8" y="-20" width="420" height="52" rx="10" fill="#eafaf1"/><circle cx="6" cy="4" r="6" fill="url(#grn)"/><text x="24" y="0" font-weight="700" fill="#1f7a4d">No-code, managed</text><text x="24" y="20" font-size="12.5" fill="#5a8a70">live in weeks</text><text x="404" y="6" font-weight="700" fill="#1e2436" text-anchor="end">Nipige, Arcadier</text></g>
    <g transform="translate(686,296)"><circle cx="6" cy="0" r="6" fill="#5b7de0"/><text x="24" y="5" font-weight="600" fill="#334455">Developer-extensible</text><text x="404" y="5" font-weight="700" fill="#1e2436" text-anchor="end">Sharetribe</text></g>
    <g transform="translate(686,350)"><circle cx="6" cy="0" r="6" fill="#5b7de0"/><text x="24" y="5" font-weight="600" fill="#334455">Self-hosted licence</text><text x="404" y="5" font-weight="700" fill="#1e2436" text-anchor="end">CS-Cart, Yo!Kart</text></g>
    <g transform="translate(686,404)"><circle cx="6" cy="0" r="6" fill="#5b7de0"/><text x="24" y="5" font-weight="600" fill="#334455">Enterprise</text><text x="404" y="5" font-weight="700" fill="#1e2436" text-anchor="end">Mirakl</text></g>
    <g transform="translate(686,458)"><circle cx="6" cy="0" r="6" fill="#5b7de0"/><text x="24" y="5" font-weight="600" fill="#334455">Fully custom no-code</text><text x="404" y="5" font-weight="700" fill="#1e2436" text-anchor="end">Bubble</text></g>
  </g>
  <rect x="672" y="516" width="426" height="60" rx="12" fill="#eef2fb" stroke="#d7deee"/>
  <text x="690" y="540" font-size="13.5" font-weight="800" fill="#33415c">Most common mistake</text>
  <text x="690" y="560" font-size="12" fill="#5a6480">Buying enterprise software when a managed one would fit.</text>
</svg>
