<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.55" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.55"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.45"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3350"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#050914" flood-opacity="0.45"/></filter>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7fd8ea"/></marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#gB)" filter="url(#blurL)"/>
  <circle cx="900" cy="600" r="240" fill="url(#gC)" filter="url(#blurL)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1"><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/></g>

  <text x="80" y="140" font-size="15" font-weight="700" letter-spacing="4" fill="#7fd8ea">MULTI-VENDOR MARKETPLACE</text>
  <text x="78" y="216" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">One marketplace,</text>
  <text x="78" y="278" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">many <tspan fill="#7fa6ff">vendors.</tspan></text>
  <text x="80" y="330" font-size="20" fill="#c2cbe6">Vendor onboarding, split payouts, and admin</text>
  <text x="80" y="358" font-size="20" fill="#c2cbe6">control &#8212; across goods, services, and rentals.</text>

  <g transform="translate(80,400)">
    <rect width="150" height="44" rx="22" fill="url(#pill)"/>
    <text x="75" y="28" font-size="15" font-weight="700" fill="#0b1226" text-anchor="middle">6 core primitives</text>
    <g transform="translate(166,0)"><rect width="140" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/><text x="70" y="28" font-size="14.5" font-weight="600" fill="#e7ecfa" text-anchor="middle">$0 platform fees</text></g>
  </g>

  <!-- vendor category nodes converging into admin hub -->
  <g filter="url(#cardShadow)"><rect x="760" y="90" width="200" height="72" rx="16" fill="#ffffff"/></g>
  <text x="860" y="120" font-size="14" font-weight="700" fill="#0f1729" text-anchor="middle">Goods vendors</text>
  <text x="860" y="142" font-size="11.5" fill="#8a91a6" text-anchor="middle">catalog &#183; inventory</text>

  <g filter="url(#cardShadow)"><rect x="760" y="279" width="200" height="72" rx="16" fill="#ffffff"/></g>
  <text x="860" y="309" font-size="14" font-weight="700" fill="#0f1729" text-anchor="middle">Service providers</text>
  <text x="860" y="331" font-size="11.5" fill="#8a91a6" text-anchor="middle">scheduling &#183; dispatch</text>

  <g filter="url(#cardShadow)"><rect x="760" y="468" width="200" height="72" rx="16" fill="#ffffff"/></g>
  <text x="860" y="498" font-size="14" font-weight="700" fill="#0f1729" text-anchor="middle">Rental hosts</text>
  <text x="860" y="520" font-size="11.5" fill="#8a91a6" text-anchor="middle">listings &#183; availability</text>

  <g filter="url(#cardShadow)"><rect x="1010" y="240" width="150" height="150" rx="20" fill="url(#dark)"/></g>
  <text x="1085" y="300" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Admin</text>
  <text x="1085" y="320" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">console</text>
  <text x="1085" y="345" font-size="10.5" fill="#b9c3e2" text-anchor="middle">split payouts</text>
  <text x="1085" y="360" font-size="10.5" fill="#b9c3e2" text-anchor="middle">one dashboard</text>

  <path d="M960 126 C 985 150, 995 190, 1012 250" fill="none" stroke="#7fd8ea" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M960 315 C 985 315, 995 315, 1008 315" fill="none" stroke="#7fd8ea" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M960 504 C 985 480, 995 440, 1012 385" fill="none" stroke="#7fd8ea" stroke-width="2.4" marker-end="url(#ah)"/>

  <text x="1128" y="606" font-size="13" fill="#6f7aa0" text-anchor="end">nipige.com</text>
</svg>
