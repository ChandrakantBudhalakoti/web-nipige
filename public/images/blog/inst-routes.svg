<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" preserveAspectRatio="xMidYMid meet" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="0.6" stop-color="#141f42"/><stop offset="1" stop-color="#1b2a54"/></linearGradient>
    <radialGradient id="g2B" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f6fe0" stop-opacity="0.4"/><stop offset="1" stop-color="#3f6fe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2O" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.4"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131d38"/><stop offset="1" stop-color="#0d152c"/></linearGradient>
    <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13321f"/><stop offset="1" stop-color="#0e2417"/></linearGradient>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="cs2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#03060f" flood-opacity="0.5"/></filter>
    <filter id="glowG" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#39a37a" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>
  <circle cx="180" cy="110" r="240" fill="url(#g2B)" filter="url(#blur2)"/>
  <circle cx="1030" cy="560" r="250" fill="url(#g2O)" filter="url(#blur2)"/>

  <text x="80" y="78" font-size="15" font-weight="700" letter-spacing="4" fill="#ff9166">THREE WAYS TO BUILD IT</text>
  <text x="78" y="122" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-1">Building an app like Instacart: pick your route</text>

  <!-- Card 1: Custom -->
  <g filter="url(#cs2)"><rect x="80" y="168" width="330" height="376" rx="18" fill="url(#cardG)" stroke="#243052"/></g>
  <circle cx="126" cy="216" r="22" fill="#1b2a4e"/><path d="M116 216 h20 M126 206 v20" stroke="#9ab6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="212" font-size="19" font-weight="800" fill="#ffffff">Custom build</text>
  <text x="160" y="233" font-size="13" font-weight="600" fill="#8fa0c6">Agency or dev team</text>
  <line x1="104" y1="256" x2="386" y2="256" stroke="#243052"/>
  <g font-size="14" fill="#c2cbe6">
    <text x="104" y="290">Cost: six figures and up</text>
    <text x="104" y="322">Time: 5 to 7 months</text>
    <text x="104" y="354">Maintained by: you</text>
  </g>
  <rect x="104" y="384" width="282" height="60" rx="10" fill="#1a1230" stroke="#3a2a4e"/>
  <text x="120" y="410" font-size="13" font-weight="700" fill="#c9a6ff">Most control</text>
  <text x="120" y="430" font-size="12.5" fill="#9a86c0">Only worth it for a genuinely novel model.</text>

  <!-- Card 2: Clone script (risky) -->
  <g filter="url(#cs2)"><rect x="435" y="168" width="330" height="376" rx="18" fill="url(#cardG)" stroke="#4a2530"/></g>
  <circle cx="481" cy="216" r="22" fill="#3a1720"/><path d="M472 207 l18 18 M490 207 l-18 18" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/>
  <text x="515" y="212" font-size="19" font-weight="800" fill="#ffffff">Clone script</text>
  <text x="515" y="233" font-size="13" font-weight="600" fill="#c99">Cheap upfront</text>
  <line x1="459" y1="256" x2="741" y2="256" stroke="#4a2530"/>
  <g font-size="14" fill="#c2cbe6">
    <text x="459" y="290">Cost: low, then hidden</text>
    <text x="459" y="322">Time: weeks, then fixes</text>
    <text x="459" y="354">Maintained by: you alone</text>
  </g>
  <rect x="459" y="384" width="282" height="60" rx="10" fill="#2a1418" stroke="#5a2a30"/>
  <text x="475" y="410" font-size="13" font-weight="700" fill="#ff9a8a">The trap</text>
  <text x="475" y="430" font-size="12.5" fill="#c98a80">Nulled code, no support, security risk.</text>

  <!-- Card 3: No-code (winner) -->
  <g filter="url(#glowG)"><rect x="790" y="156" width="330" height="400" rx="18" fill="url(#winG)" stroke="#2e6a4a"/></g>
  <rect x="790" y="156" width="330" height="34" rx="17" fill="#39a37a"/><text x="955" y="179" font-size="13" font-weight="800" fill="#04140c" text-anchor="middle" letter-spacing="1">RECOMMENDED FOR MOST</text>
  <circle cx="836" cy="228" r="22" fill="#0f3423"/><path d="M826 228 l6 7 l12 -14" fill="none" stroke="#7ad0a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="870" y="224" font-size="19" font-weight="800" fill="#ffffff">No-code platform</text>
  <text x="870" y="245" font-size="13" font-weight="600" fill="#8fd8b4">Configure, do not code</text>
  <line x1="814" y1="268" x2="1096" y2="268" stroke="#2e6a4a"/>
  <g font-size="14" fill="#d6f0e2">
    <text x="814" y="302">Cost: flat monthly plan</text>
    <text x="814" y="334">Time: about 14 days</text>
    <text x="814" y="366">Maintained by: the platform</text>
  </g>
  <rect x="814" y="396" width="282" height="70" rx="10" fill="#0f3423" stroke="#2e6a4a"/>
  <text x="830" y="422" font-size="13" font-weight="700" fill="#8fe6bd">Supported and branded</text>
  <text x="830" y="442" font-size="12.5" fill="#a9d8c2">Customer, store, and admin apps,</text>
  <text x="830" y="459" font-size="12.5" fill="#a9d8c2">hosted and maintained for you.</text>

  <text x="600" y="596" font-size="14" font-weight="600" fill="#6f7aa0" text-anchor="middle">The cheapest option upfront is usually the most expensive by month three.</text>
</svg>
